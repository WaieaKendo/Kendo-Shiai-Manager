name: Deploy

# Two ways in, never from a pull request (docs/DEPLOYMENT.md):
#
#   Deploy dev         every push to `develop`: npm test -> wrangler deploy --env dev
#                      -> the dev URL's /api/health must report package.json's version.
#   Deploy production  ONLY by hand: Actions -> Deploy -> "Run workflow" with branch `main`
#                      (any other branch is refused) -> npm test -> wrangler deploy (top level of
#                      wrangler.jsonc) -> the production /api/health must report the version.
#
# LATER, once the owner has repo admin (until then there are no GitHub environments):
#   1. Settings -> Environments -> New environment `production`; Required reviewers: the owner;
#      Deployment branches: `main` only. Move CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID into it
#      (or keep them as repository secrets).
#   2. Here: add `main` to on.push.branches, let the production job run on a push to main too
#      (see its `if:`), and give it `environment: production`. Every merge to main then deploys
#      production after the reviewer approves (the run waits on "Review deployments").
#   3. Keep workflow_dispatch as the fallback (re-deploy main, e.g. after a rollback).
on:
  push:
    branches: [develop]
  workflow_dispatch:

run-name: ${{ github.event_name == 'workflow_dispatch' && 'Deploy production' || 'Deploy dev' }} (${{ github.ref_name }})

permissions:
  contents: read

env:
  DEV_URL: https://kendoshiaimanager-dev.samanthakodamaworkersdev.workers.dev
  # Production still runs on the Worker named kendoshiaimanager-cloud-staging (renaming it is a
  # separate, supervised step: docs/DEPLOYMENT.md, "Renaming production").
  PRODUCTION_URL: https://kendoshiaimanager-cloud-staging.samanthakodamaworkersdev.workers.dev

jobs:
  refuse:
    name: Refuse production from a branch other than main
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Deploy production only runs from main (this run is on ${GITHUB_REF}). Choose 'Branch: main' under Run workflow."
          exit 1

  test:
    name: Tests
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml

  dev:
    name: Deploy dev
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy kendoshiaimanager-dev
        run: npm run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check (version must equal package.json)
        run: node scripts/health-check.mjs "$DEV_URL"

  production:
    name: Deploy production
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Only main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::refusing to deploy $GITHUB_REF to production"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version already live?
        # Every production release needs a new version, or installed devices keep the old offline
        # copy (the service worker cache is named after it). A re-deploy of the same version is
        # allowed (e.g. after a rollback), so this only warns.
        run: |
          want=$(node -p "require('./package.json').version")
          live=$(node -e "fetch(process.env.PRODUCTION_URL + '/api/health').then(r => r.json()).then(b => console.log(b.version)).catch(() => console.log('unreachable'))")
          echo "production now: $live; deploying: $want"
          if [ "$live" = "$want" ]; then echo "::warning::production already runs $want; installed devices will not refresh their offline copy. Release with npm run release -- <version>."; fi
      - name: Build and deploy production (kendoshiaimanager-cloud-staging)
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check (version must equal package.json)
        run: node scripts/health-check.mjs "$PRODUCTION_URL"
